<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motefield demo</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #0b1020; color: #e8ecf6; }
  section { position: relative; height: 70vh; display: grid; place-items: center; text-align: center; border-bottom: 1px solid #1c2440; }
  section > div { position: relative; padding: 1rem 1.5rem; background: #0b1020b3; border-radius: 12px; }
  h2 { margin: 0 0 .25rem; font-size: 1.25rem; }
  p { margin: 0; opacity: .75; font-size: .9rem; }
  #stats { position: fixed; right: 12px; bottom: 12px; font: 12px/1.4 ui-monospace, monospace; background: #000a; padding: 6px 10px; border-radius: 8px; z-index: 10; }
</style>
</head>
<body>

<!-- 1. Emoji + text glyphs, pointer repel, click burst -->
<section id="a">
  <div><h2>Emoji &amp; glyphs</h2><p>Move the pointer to repel, click to burst.</p></div>
</section>

<!-- 2. Inline SVG + SVG path + custom draw function + registered shape -->
<section id="b">
  <div><h2>SVG, path &amp; custom draw</h2><p>Swirl around the pointer, with link lines.</p></div>
</section>

<!-- 3. Preset via markup only (no JavaScript options needed) -->
<section data-motefield="snow">
  <div><h2>Preset from markup</h2><p><code>data-motefield="snow"</code></p></div>
</section>

<div id="stats"></div>

<script src="./motefield.js"></script>
<script>
  /* A shape you define once and reuse by name anywhere. */
  Motefield.registerShape('bolt', function (ctx, size) {
    var s = size / 2;
    ctx.beginPath();
    ctx.moveTo(s * 0.2, -s); ctx.lineTo(-s * 0.5, s * 0.1); ctx.lineTo(0, s * 0.1);
    ctx.lineTo(-s * 0.2, s); ctx.lineTo(s * 0.5, -s * 0.15); ctx.lineTo(0, -s * 0.15);
    ctx.closePath(); ctx.fill();
  });

  var a = Motefield.create('#a', {
    shapes: ['❄', '✨', { glyph: '🔥', weight: 0.4 }, { glyph: 'ᛉ', font: 'serif', tint: true }],
    colors: ['#9ad1ff', '#ffffff'],
    count: 40, size: [14, 28], opacity: [0.5, 1],
    rotation: { enable: true, speed: [-40, 40] },
    motion: { mode: 'sway', speed: [14, 34] },
    pointer: { mode: 'repel', radius: 130 },
    click: { mode: 'burst', count: 12 },
    fps: 30
  });

  var heartSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#ff6b9d" d="M12 21s-7-4.6-9.3-9A5.4 5.4 0 0 1 12 6.5 5.4 5.4 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg>';

  var b = Motefield.create('#b', {
    shapes: [
      { svg: heartSvg, weight: 1 },
      { path: 'M12 2l2.9 6.9L22 10l-5.5 4.7L18 22l-6-3.6L6 22l1.5-7.3L2 10l7.1-1.1z', viewBox: 24, colors: ['#ffd166'] },
      { shape: 'bolt', colors: ['#4cc9f0'] },
      { draw: function (ctx, size, color) { ctx.strokeStyle = color; ctx.lineWidth = size * 0.1; ctx.strokeRect(-size * .3, -size * .3, size * .6, size * .6); }, colors: ['#b980f7'] }
    ],
    count: 36, size: [12, 24], motion: { mode: 'flow', speed: [10, 24] },
    pointer: { mode: 'swirl', radius: 150 },
    links: { enable: true, distance: 110, opacity: 0.18 },
    parallax: 0.04
  });

  Motefield.scan();   // creates the data-motefield="snow" section

  var el = document.getElementById('stats');
  setInterval(function () {
    var s = a.getStats(), t = b.getStats();
    el.textContent = 'A ' + s.particles + 'p ' + s.fps + 'fps ' + s.frameMs + 'ms | B ' + t.particles + 'p ' + t.fps + 'fps ' + t.frameMs + 'ms';
  }, 500);
</script>
</body>
</html>
